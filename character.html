<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Character</title>

    <link rel="stylesheet" href="character.css">
</head>

<body>

    <!-- VIDEO QUESTION BUBBLE -->

    <div
        id="videoCheck"
        class="video-check"
        hidden
    >

        <p class="video-check-question">
            Is this video for
            <span id="videoCheckSubject"></span>?
        </p>

        <p
            id="videoCheckTitle"
            class="video-check-title"
        ></p>

        <div class="video-check-actions">

            <button
                id="videoCheckYes"
                class="video-check-button yes"
            >
                Yes
            </button>

            <button
                id="videoCheckNo"
                class="video-check-button no"
            >
                No
            </button>

        </div>

    </div>


    <video
        id="characterVideo"
        autoplay
        loop
        muted
        playsinline
    ></video>

    <script src="character.js"></script>

</body>

</html>
